<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Bible Reading Tracker</title><link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><meta name="theme-color" content="#ffcb05"><style>*{box-sizing:border-box}body{margin:0;background:#fff9e3;color:#00274c;font:16px system-ui,sans-serif}header{background:#00274c;color:#ffcb05;padding:24px 16px;border-bottom:6px solid #ffcb05}header h1{font-size:1.5rem;margin:0}header p{margin:6px 0 0;color:white}main{max-width:850px;margin:auto;padding:16px}.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:14px 7px;background:#ffcb05;color:#00274c;border:2px solid #d5ab00;border-radius:10px;font-weight:bold}.tabs button[aria-selected=true]{background:#00274c;color:#ffcb05}.summary{background:#fff2b9;padding:16px;border-radius:12px;margin:18px 0}.bar{height:13px;background:#e4dcae;border-radius:12px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#00274c;width:0}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{padding:10px;background:#ffcb05;border:1px solid #d5ab00;border-radius:8px;color:#00274c}details{background:#fff7d8;border:1px solid #e9d78a;border-radius:10px;margin:8px 0}summary{padding:14px;cursor:pointer;font-weight:bold;display:flex;justify-content:space-between}.count{font-weight:normal;font-size:.85rem}.chapters{padding:5px 12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:8px}.chapters label{background:#fff4c4;padding:10px 5px;border:1px solid #dfcf87;border-radius:8px;display:flex;gap:6px;align-items:center;justify-content:center}.chapters label:has(input:checked){background:#ffcb05}input{accent-color:#00274c} .book-finish{padding:0 14px 14px;color:#00274c;font-size:.9rem}.book-finish button{margin-left:8px;padding:7px 11px;border:1px solid #b89728;border-radius:7px;background:#ffcb05;color:#00274c;font-weight:bold}footer{font-size:.85rem;padding:20px;color:#425a78}</style></head><body><header><h1>Family Bible Reading Tracker</h1><p>Track every chapter, together.</p></header><main><nav class="tabs"><button id="morning" aria-selected="true">Morning</button><button id="evening" aria-selected="false">Evening</button></nav><section class="summary"><strong id="heading"></strong><div class="bar"><div class="fill" id="fill"></div></div><div id="progress"></div><div id="next"></div></section><div class="actions"><button id="expand">Expand all</button><button id="collapse">Collapse all</button><button id="backup">Back up progress</button><button id="restore">Restore backup</button><input type="file" id="file" accept=".json" hidden></div><h2>Old Testament</h2><div id="old"></div><h2>New Testament</h2><div id="new"></div><footer>Progress is saved on this device and browser. Use backup to protect it. Syncing between devices is not yet available.</footer></main><script>const books=[["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],["Joshua",24],["Judges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],["Esther",10],["Job",42],["Psalms",150],["Proverbs",31],["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],["Jeremiah",52],["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]],key="family-bible-tracker-v1";let active="morning",state={morning:{},evening:{}},recent={morning:null,evening:null},completed={morning:{},evening:{}};try{const s=JSON.parse(localStorage.getItem(key));for(const g of ["morning","evening"])if(s&&s[g]&&typeof s[g]==="object")state[g]=s[g];const savedRecent=JSON.parse(localStorage.getItem(key+"-recent")||"{}");for(const g of ["morning","evening"])if(savedRecent[g]&&state[g][savedRecent[g]])recent[g]=savedRecent[g];const savedCompleted=JSON.parse(localStorage.getItem(key+"-completed")||"{}");for(const g of ["morning","evening"])if(savedCompleted[g]&&typeof savedCompleted[g]==="object")completed[g]=savedCompleted[g]}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(state));localStorage.setItem(key+"-recent",JSON.stringify(recent));localStorage.setItem(key+"-completed",JSON.stringify(completed))}function has(b,n){return !!state[active][b+"|"+n]}function update(){let done=0,next="";for(const [b,c] of books)for(let n=1;n<=c;n++)if(has(b,n))done++;else if(!next)next=b+" "+n;document.getElementById("progress").textContent=done+" of 1,189 chapters completed ("+Math.round(done/1189*100)+"%)";const last=recent[active];document.getElementById("next").textContent=last&&state[active][last]?"Most recent chapter checked: "+last.replace("|"," "):"Most recent chapter checked: None recorded yet";document.getElementById("fill").style.width=(done/1189*100)+"%"}function render(){for(const g of ["morning","evening"])document.getElementById(g).setAttribute("aria-selected",String(active===g));document.getElementById("heading").textContent=active==="morning"?"Morning":"Evening";for(const [id,items] of [["old",books.slice(0,39)],["new",books.slice(39)]]){const root=document.getElementById(id);root.replaceChildren();for(const [b,c] of items){const d=document.createElement("details"),s=document.createElement("summary"),count=document.createElement("span"),grid=document.createElement("div");count.className="count";grid.className="chapters";function tally(){let k=0;for(let n=1;n<=c;n++)if(has(b,n))k++;count.textContent=k+" / "+c}tally();s.append(document.createTextNode(b),count);d.append(s);for(let n=1;n<=c;n++){const label=document.createElement("label"),cb=document.createElement("input");cb.type="checkbox";cb.checked=has(b,n);cb.setAttribute("aria-label",b+" chapter "+n);cb.onchange=()=>{if(cb.checked){state[active][b+"|"+n]=true;recent[active]=b+"|"+n}else{delete state[active][b+"|"+n];if(recent[active]===b+"|"+n)recent[active]=null}save();tally();showFinish();update()};label.append(cb,document.createTextNode(n));grid.append(label)}const finish=document.createElement("div");finish.className="book-finish";function showFinish(){const total=Array.from({length:c},(_,i)=>has(b,i+1)).filter(Boolean).length;const prior=s.querySelector(".completion-date");if(prior)prior.remove();if(total===c&&!completed[active][b]){completed[active][b]=new Date().toISOString();save()}if(total===c&&completed[active][b]){const date=document.createElement("span");date.className="completion-date";date.textContent=" ✓ Completed "+new Date(completed[active][b]).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});s.insertBefore(date,count)}finish.replaceChildren();if(total===c){if(!completed[active][b]){completed[active][b]=new Date().toISOString();save()}const stamp=document.createElement("span");stamp.textContent="Completed: "+new Date(completed[active][b]).toLocaleString("en-US",{dateStyle:"long",timeStyle:"short"});const restart=document.createElement("button");restart.type="button";restart.textContent="Start Again";restart.onclick=()=>{if(!confirm("Start "+b+" again? This will clear all chapter checkmarks for this book in the "+active+" group."))return;for(let i=1;i<=c;i++)delete state[active][b+"|"+i];delete completed[active][b];if(recent[active]&&recent[active].startsWith(b+"|"))recent[active]=null;save();render()};finish.append(stamp,restart)}else if(completed[active][b]){const stamp=document.createElement("span");stamp.textContent="Previously completed: "+new Date(completed[active][b]).toLocaleString("en-US",{dateStyle:"long",timeStyle:"short"});finish.append(stamp)}}showFinish();d.append(grid,finish);root.append(d)}}update()}for(const g of ["morning","evening"])document.getElementById(g).onclick=()=>{active=g;render()};document.getElementById("expand").onclick=()=>document.querySelectorAll("details").forEach(x=>x.open=true);document.getElementById("collapse").onclick=()=>document.querySelectorAll("details").forEach(x=>x.open=false);document.getElementById("backup").onclick=()=>{const blob=new Blob([JSON.stringify({version:2,progress:state,recent:recent,completed:completed},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="family-bible-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById("restore").onclick=()=>document.getElementById("file").click();document.getElementById("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(![1,2].includes(x.version)||!x.progress||!x.progress.morning||!x.progress.evening)throw Error();if(confirm("Replace progress for both groups?")){state=x.progress;recent=x.recent&&x.version===2?x.recent:{morning:null,evening:null};completed=x.completed&&x.version===2?x.completed:{morning:{},evening:{}};save();render()}}catch(e){alert("Invalid backup file")}e.target.value=""};render();</script></body></html>
